name: Daily Dynamic Granger-LASSO Run

on:
  schedule:
    - cron: '40 23 * * 1-6'
  workflow_dispatch:

jobs:
  run-dynamic-granger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Dynamic Granger-LASSO Engine
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python trainer.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-granger-results
          path: |
            dynamic_granger_*.json
            dynamic_granger_breakdown_*.json
